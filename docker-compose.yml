services:
  backend:
    build: .
    ports:
      - '5001:5001'
    environment:
      RAILS_ENV: development
      DATABASE_HOST: db
      DATABASE_NAME: circle_development
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: password
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis
    volumes:
      - .:/app

  sidekiq:
    build: .
    command: bundle exec sidekiq
    environment:
      RAILS_ENV: development
      DATABASE_HOST: db
      DATABASE_NAME: circle_development
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: password
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis
    volumes:
      - .:/app

  db:
    image: postgres:14.13
    ports:
      - '5433:5432'
    environment:
      POSTGRES_DB: circle_development
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7.2.5

volumes:
  postgres_data:
